plugins {
    id 'java-library'
}

dependencies {
    implementation project(':barter-api')
    implementation project(':barter-domain')
    implementation project(':barter-common')
    implementation project(':barter-infrastructure')

    implementation "org.mapstruct:mapstruct:${rootProject.ext.mapstructVersion}"
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'org.springframework.security:spring-security-crypto'

    api 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

    compileOnly 'org.projectlombok:lombok:1.18.46'

    annotationProcessor "org.mapstruct:mapstruct-processor:${rootProject.ext.mapstructVersion}"
    annotationProcessor 'org.projectlombok:lombok:1.18.46'

    testImplementation 'org.mockito:mockito-junit-jupiter:5.23.0'
    testImplementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    testImplementation 'org.springframework:spring-test'
    testRuntimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    testRuntimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'
}

