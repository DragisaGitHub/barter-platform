plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

def testcontainersVersion = '1.21.4'

dependencyManagement {
    imports {
        mavenBom "org.testcontainers:testcontainers-bom:${testcontainersVersion}"
    }
}

dependencies {
    constraints {
        testImplementation('org.apache.commons:commons-compress:1.26.2') {
            because 'Testcontainers transitively resolves commons-compress 1.24.0, which is flagged by the dependency vulnerability warning'
        }
    }

    implementation project(':barter-api')
    implementation project(':barter-application')
    implementation project(':barter-common')
    implementation project(':barter-domain')
    implementation project(':barter-infrastructure')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'com.azure:azure-storage-blob:12.25.1'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    implementation "org.mapstruct:mapstruct:${rootProject.ext.mapstructVersion}"

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor "org.mapstruct:mapstruct-processor:${rootProject.ext.mapstructVersion}"

    runtimeOnly 'org.postgresql:postgresql'

    // JJWT deps needed by barter-application's JwtServiceImpl at runtime
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation "org.testcontainers:junit-jupiter:${testcontainersVersion}"
    testImplementation "org.testcontainers:postgresql:${testcontainersVersion}"
}

tasks.withType(Test).configureEach {
    systemProperty 'barter.rate-limits.enabled', 'false'
}

