spring:
  application:
    name: barter-platform
  # spring.mail.host is intentionally absent here.
  # Set SPRING_MAIL_HOST (+ SPRING_MAIL_USERNAME / SPRING_MAIL_PASSWORD) env vars
  # or configure spring.mail.host in an environment-specific profile to enable real email delivery.
  # Without it, the LoggingMailSender fallback is used (codes printed to console).
  mail:
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:12MB}
  web:
    error:
      whitelabel:
        enabled: false

server:
  port: 8080
  servlet:
    context-path: /api/v1

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${BARTER_SWAGGER_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${BARTER_SWAGGER_ENABLED:true}

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health
  endpoint:
    health:
      validate-group-membership: false
      probes:
        enabled: true
      show-details: never
      show-components: never
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,ping,db,diskSpace
  health:
    ping:
      enabled: true
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level app=${spring.application.name:-barter-platform} correlationId=%X{correlationId:-na} thread=%thread logger=%logger{36} - %msg%n%wEx"

barter:
  email-verification:
    enabled: ${BARTER_EMAIL_VERIFICATION_ENABLED:true}
  jwt:
    secret: ${JWT_SECRET:default-dev-secret-key-that-is-at-least-32-bytes-long!!}
    access-token-expiration-minutes: ${JWT_ACCESS_EXPIRATION_MINUTES:30}
    refresh-token-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:7}
  verification:
    code-expiration-minutes: ${BARTER_VERIFICATION_CODE_EXPIRATION_MINUTES:15}
  mail:
    from: ${MAIL_FROM:noreply@barter-platform.com}
  security:
    allowed-origins: ${BARTER_SECURITY_ALLOWED_ORIGINS:${FRONTEND_ORIGIN:}}
    swagger-enabled: ${BARTER_SWAGGER_ENABLED:true}
  rate-limits:
    enabled: ${BARTER_RATE_LIMITS_ENABLED:true}
    # Leave blank to use the servlet remote address. Set only behind a trusted proxy
    # that strips incoming client IP headers before adding its own value.
    client-ip-header: ${BARTER_RATE_LIMITS_CLIENT_IP_HEADER:}
    login:
      limit: ${BARTER_RATE_LIMITS_LOGIN_LIMIT:20}
      window: ${BARTER_RATE_LIMITS_LOGIN_WINDOW:1m}
    register:
      limit: ${BARTER_RATE_LIMITS_REGISTER_LIMIT:10}
      window: ${BARTER_RATE_LIMITS_REGISTER_WINDOW:1m}
    refresh-token:
      limit: ${BARTER_RATE_LIMITS_REFRESH_TOKEN_LIMIT:60}
      window: ${BARTER_RATE_LIMITS_REFRESH_TOKEN_WINDOW:1m}
    forgot-password:
      limit: ${BARTER_RATE_LIMITS_FORGOT_PASSWORD_LIMIT:5}
      window: ${BARTER_RATE_LIMITS_FORGOT_PASSWORD_WINDOW:15m}
    reset-password:
      limit: ${BARTER_RATE_LIMITS_RESET_PASSWORD_LIMIT:10}
      window: ${BARTER_RATE_LIMITS_RESET_PASSWORD_WINDOW:15m}
    resend-verification-code:
      limit: ${BARTER_RATE_LIMITS_RESEND_VERIFICATION_CODE_LIMIT:5}
      window: ${BARTER_RATE_LIMITS_RESEND_VERIFICATION_CODE_WINDOW:15m}
    image-upload:
      limit: ${BARTER_RATE_LIMITS_IMAGE_UPLOAD_LIMIT:30}
      window: ${BARTER_RATE_LIMITS_IMAGE_UPLOAD_WINDOW:10m}
    trade-offer-create:
      limit: ${BARTER_RATE_LIMITS_TRADE_OFFER_CREATE_LIMIT:20}
      window: ${BARTER_RATE_LIMITS_TRADE_OFFER_CREATE_WINDOW:10m}
    trade-message-send:
      limit: ${BARTER_RATE_LIMITS_TRADE_MESSAGE_SEND_LIMIT:60}
      window: ${BARTER_RATE_LIMITS_TRADE_MESSAGE_SEND_WINDOW:10m}
    favorite-mutation:
      limit: ${BARTER_RATE_LIMITS_FAVORITE_MUTATION_LIMIT:120}
      window: ${BARTER_RATE_LIMITS_FAVORITE_MUTATION_WINDOW:10m}
  bootstrap:
    admin:
      enabled: ${BARTER_BOOTSTRAP_ADMIN_ENABLED:false}
      username: ${BARTER_BOOTSTRAP_ADMIN_USERNAME:}
      email: ${BARTER_BOOTSTRAP_ADMIN_EMAIL:}
      password: ${BARTER_BOOTSTRAP_ADMIN_PASSWORD:}
  storage:
    type: ${BARTER_STORAGE_TYPE:local}
    local:
      base-path: ${BARTER_STORAGE_BASE_PATH:./uploads}
    azure:
      connection-string: ${AZURE_STORAGE_CONNECTION_STRING:}
      container-name: ${AZURE_STORAGE_CONTAINER:}
    max-images-per-item: ${BARTER_STORAGE_MAX_IMAGES_PER_ITEM:6}
    max-image-size-bytes: ${BARTER_STORAGE_MAX_IMAGE_SIZE_BYTES:10485760}



