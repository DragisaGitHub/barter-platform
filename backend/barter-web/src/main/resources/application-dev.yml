spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/barter_db}
    username: ${DB_USERNAME:barter_user}
    password: ${DB_PASSWORD:barter_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  forward-headers-strategy: framework

barter:
  email-verification:
    enabled: false
  jwt:
    access-token-expiration-minutes: ${JWT_ACCESS_EXPIRATION_MINUTES:30}
    refresh-token-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:14}
  security:
    allowed-origins: ${BARTER_SECURITY_ALLOWED_ORIGINS:${FRONTEND_ORIGIN:}}
  storage:
    type: azure
    azure:
      connection-string: ${AZURE_STORAGE_CONNECTION_STRING_DEV:${AZURE_STORAGE_CONNECTION_STRING:}}
      container-name: ${AZURE_STORAGE_CONTAINER_DEV:${AZURE_STORAGE_CONTAINER:}}

sentry:
  environment: dev

