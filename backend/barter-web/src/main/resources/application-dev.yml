spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/barter_db}
    username: ${DB_USERNAME:barter_user}
    password: ${DB_PASSWORD:barter_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

barter:
  email-verification:
    enabled: false

storage:
  type: azure

azure:
  storage:
    connection-string: ${AZURE_STORAGE_CONNECTION_STRING_DEV}
    container-name: ${AZURE_STORAGE_CONTAINER_DEV}

