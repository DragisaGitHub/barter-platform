spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/barter_db
    username: barter_user
    password: barter_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

  # ── Mailpit (local SMTP catch-all) ──────────────────────────────────────────
  # Start with:  docker compose up -d mailpit
  # Inspect at:  http://localhost:8025
  mail:
    host: localhost
    port: 1025
    username: ""
    password: ""
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
            required: false

barter:
  mail:
    from: noreply@barter-platform.local
  security:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - http://localhost:4173
      - http://127.0.0.1:4173
  storage:
    type: local
    local:
      base-path: uploads/

logging:
  level:
    org.hibernate.SQL: off
    org.hibernate.orm.jdbc.bind: off
    org.springframework.security: info
    com.barterplatform: debug