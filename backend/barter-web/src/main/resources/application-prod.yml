spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

barter:
  email-verification:
    enabled: true
  security:
    allowed-origins: ${BARTER_SECURITY_ALLOWED_ORIGINS:${FRONTEND_ORIGIN:}}
    swagger-enabled: false
  storage:
    type: azure
    azure:
      connection-string: ${AZURE_STORAGE_CONNECTION_STRING_PROD:${AZURE_STORAGE_CONNECTION_STRING:}}
      container-name: ${AZURE_STORAGE_CONTAINER_PROD:${AZURE_STORAGE_CONTAINER:}}

