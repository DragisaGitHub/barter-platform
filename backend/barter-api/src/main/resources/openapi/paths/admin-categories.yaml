categories:
  get:
    tags:
      - AdminCategories
    operationId: listAdminCategories
    summary: List categories for administrators
    security:
      - bearerJwt: []
    parameters:
      - $ref: '../openapi.yaml#/components/parameters/Page'
      - $ref: '../openapi.yaml#/components/parameters/Size'
      - $ref: '../openapi.yaml#/components/parameters/Sort'
      - name: q
        in: query
        required: false
        description: Search by category name or slug.
        schema:
          type: string
          maxLength: 255
      - name: includeDeleted
        in: query
        required: false
        description: Include soft-deleted categories in the result.
        schema:
          type: boolean
          default: false
    responses:
      '200':
        description: Categories returned successfully
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/AdminCategoryPagedResponse'
      '400':
        $ref: '../components/responses/BadRequest.yaml'
      '401':
        $ref: '../components/responses/Unauthorized.yaml'
      '403':
        $ref: '../components/responses/Forbidden.yaml'
  post:
    tags:
      - AdminCategories
    operationId: createAdminCategory
    summary: Create a category
    security:
      - bearerJwt: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/CreateCategoryRequest'
    responses:
      '201':
        description: Category created successfully
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/AdminCategoryResponse'
      '400':
        $ref: '../components/responses/BadRequest.yaml'
      '401':
        $ref: '../components/responses/Unauthorized.yaml'
      '403':
        $ref: '../components/responses/Forbidden.yaml'
      '409':
        $ref: '../components/responses/Conflict.yaml'

categoryByUuid:
  get:
    tags:
      - AdminCategories
    operationId: getAdminCategoryByUuid
    summary: Get category detail for administrators
    security:
      - bearerJwt: []
    parameters:
      - name: categoryUuid
        in: path
        required: true
        description: Category UUID.
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Category returned successfully
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/AdminCategoryResponse'
      '401':
        $ref: '../components/responses/Unauthorized.yaml'
      '403':
        $ref: '../components/responses/Forbidden.yaml'
      '404':
        $ref: '../components/responses/NotFound.yaml'
  patch:
    tags:
      - AdminCategories
    operationId: updateAdminCategory
    summary: Update a category
    security:
      - bearerJwt: []
    parameters:
      - name: categoryUuid
        in: path
        required: true
        description: Category UUID.
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/UpdateCategoryRequest'
    responses:
      '200':
        description: Category updated successfully
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/AdminCategoryResponse'
      '400':
        $ref: '../components/responses/BadRequest.yaml'
      '401':
        $ref: '../components/responses/Unauthorized.yaml'
      '403':
        $ref: '../components/responses/Forbidden.yaml'
      '404':
        $ref: '../components/responses/NotFound.yaml'
      '409':
        $ref: '../components/responses/Conflict.yaml'
  delete:
    tags:
      - AdminCategories
    operationId: deleteAdminCategory
    summary: Soft-delete a category
    security:
      - bearerJwt: []
    parameters:
      - name: categoryUuid
        in: path
        required: true
        description: Category UUID.
        schema:
          type: string
          format: uuid
    responses:
      '204':
        description: Category deleted successfully
      '401':
        $ref: '../components/responses/Unauthorized.yaml'
      '403':
        $ref: '../components/responses/Forbidden.yaml'
      '404':
        $ref: '../components/responses/NotFound.yaml'

