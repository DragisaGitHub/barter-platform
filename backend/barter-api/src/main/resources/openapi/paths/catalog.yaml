categories:
  get:
    tags:
      - Catalog
    operationId: listCategories
    summary: List all categories
    responses:
      '200':
        description: Categories returned successfully
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../openapi.yaml#/components/schemas/CategoryResponse'

popularCategories:
  get:
    tags:
      - Catalog
    operationId: listPopularCategories
    summary: List popular categories by active item count
    parameters:
      - name: limit
        in: query
        required: false
        description: Maximum number of popular categories to return.
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 20
          default: 6
    responses:
      '200':
        description: Popular categories returned successfully
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../openapi.yaml#/components/schemas/PopularCategoryResponse'
      '400':
        $ref: '../components/responses/BadRequest.yaml'

categoryFormSchema:
  get:
    tags:
      - Catalog
    operationId: getCategoryFormSchema
    summary: Get the active form schema for a category
    description: Returns the active category schema (metadata, ordered fields, and ordered options) so clients can build dynamic listing forms. If no active schema exists for the category, an empty schema response is returned instead of an error.
    parameters:
      - name: categoryUuid
        in: path
        required: true
        description: Category UUID.
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Category form schema returned successfully
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/CategoryFormSchemaResponse'
      '404':
        $ref: '../components/responses/NotFound.yaml'

tags:
  get:
    tags:
      - Catalog
    operationId: listTags
    summary: List all tags
    responses:
      '200':
        description: Tags returned successfully
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../openapi.yaml#/components/schemas/TagResponse'

items:
  get:
    tags:
      - Catalog
    operationId: searchItems
    summary: Search and browse items
    parameters:
      - $ref: '../openapi.yaml#/components/parameters/Page'
      - $ref: '../openapi.yaml#/components/parameters/Size'
      - $ref: '../openapi.yaml#/components/parameters/Sort'
      - name: q
        in: query
        required: false
        description: Free-text search on item title.
        schema:
          type: string
          maxLength: 255
      - name: categoryUuid
        in: query
        required: false
        description: Filter by category UUID.
        schema:
          type: string
          format: uuid
      - name: tagUuids
        in: query
        required: false
        description: Filter by one or more tag UUIDs.
        schema:
          type: array
          items:
            type: string
            format: uuid
        explode: true
      - name: condition
        in: query
        required: false
        description: Filter by item condition.
        schema:
          $ref: '../components/schemas/catalog/ItemCondition.yaml'
      - name: location
        in: query
        required: false
        description: Case-insensitive text filter across approximate exchange city, area, and location labels. No GPS, maps, or distance calculations are used.
        schema:
          type: string
          maxLength: 255
    responses:
      '200':
        description: Items returned successfully
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ItemPagedResponse'
      '400':
        $ref: '../components/responses/BadRequest.yaml'
  post:
    tags:
      - Catalog
    operationId: createItem
    summary: Create a new item listing
    security:
      - bearerJwt: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/CreateItemRequest'
    responses:
      '201':
        description: Item created successfully
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ItemDetailResponse'
      '400':
        $ref: '../components/responses/BadRequest.yaml'
      '401':
        $ref: '../components/responses/Unauthorized.yaml'
      '403':
        $ref: '../components/responses/Forbidden.yaml'

recommendations:
  get:
    tags:
      - Catalog
    operationId: listRecommendations
    summary: List lightweight item recommendations
    description: Returns deterministic, privacy-safe recommendations using existing marketplace data only. Authenticated users receive personalized results when signals exist; anonymous or signal-free requests receive a safe recent-popular fallback.
    parameters:
      - $ref: '../openapi.yaml#/components/parameters/Page'
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 50
          default: 12
      - name: sort
        in: query
        required: false
        description: Reserved for contract consistency. Recommendation ordering is deterministic and score-based; unsupported values are ignored.
        schema:
          type: string
          default: recommendationScore,desc
    responses:
      '200':
        description: Recommendations returned successfully
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/RecommendationPagedResponse'
      '400':
        $ref: '../components/responses/BadRequest.yaml'

itemsMine:
  get:
    tags:
      - Catalog
    operationId: listMyItems
    summary: List items owned by the authenticated user
    security:
      - bearerJwt: []
    parameters:
      - $ref: '../openapi.yaml#/components/parameters/Page'
      - $ref: '../openapi.yaml#/components/parameters/Size'
      - $ref: '../openapi.yaml#/components/parameters/Sort'
      - name: status
        in: query
        required: false
        description: Filter own items by status.
        schema:
          $ref: '../components/schemas/catalog/ItemStatus.yaml'
    responses:
      '200':
        description: Own items returned successfully
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ItemPagedResponse'
      '401':
        $ref: '../components/responses/Unauthorized.yaml'

favorites:
  get:
    tags:
      - Catalog
    operationId: listFavoriteItems
    summary: List favorite items for the authenticated user
    security:
      - bearerJwt: []
    parameters:
      - $ref: '../openapi.yaml#/components/parameters/Page'
      - $ref: '../openapi.yaml#/components/parameters/Size'
      - $ref: '../openapi.yaml#/components/parameters/Sort'
    responses:
      '200':
        description: Favorite items returned successfully
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ItemPagedResponse'
      '401':
        $ref: '../components/responses/Unauthorized.yaml'

itemByUuid:
  get:
    tags:
      - Catalog
    operationId: getItemByUuid
    summary: Get item detail by UUID
    parameters:
      - $ref: '../openapi.yaml#/components/parameters/ItemUuid'
    responses:
      '200':
        description: Item returned successfully
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ItemDetailResponse'
      '404':
        $ref: '../components/responses/NotFound.yaml'
  patch:
    tags:
      - Catalog
    operationId: updateItem
    summary: Update an owned item listing
    security:
      - bearerJwt: []
    parameters:
      - $ref: '../openapi.yaml#/components/parameters/ItemUuid'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/UpdateItemRequest'
    responses:
      '200':
        description: Item updated successfully
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ItemDetailResponse'
      '400':
        $ref: '../components/responses/BadRequest.yaml'
      '401':
        $ref: '../components/responses/Unauthorized.yaml'
      '403':
        $ref: '../components/responses/Forbidden.yaml'
      '404':
        $ref: '../components/responses/NotFound.yaml'
  delete:
    tags:
      - Catalog
    operationId: removeItem
    summary: Soft-remove an item (moderator/admin)
    security:
      - bearerJwt: []
    parameters:
      - $ref: '../openapi.yaml#/components/parameters/ItemUuid'
    responses:
      '204':
        description: Item removed successfully
      '401':
        $ref: '../components/responses/Unauthorized.yaml'
      '403':
        $ref: '../components/responses/Forbidden.yaml'
      '404':
        $ref: '../components/responses/NotFound.yaml'

itemFavorite:
  post:
    tags:
      - Catalog
    operationId: favoriteItem
    summary: Mark an item as favorite for the authenticated user
    security:
      - bearerJwt: []
    parameters:
      - $ref: '../openapi.yaml#/components/parameters/ItemUuid'
    responses:
      '200':
        description: Item favorited successfully
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/MessageResponse'
      '401':
        $ref: '../components/responses/Unauthorized.yaml'
      '404':
        $ref: '../components/responses/NotFound.yaml'
      '429':
        $ref: '../components/responses/TooManyRequests.yaml'
  delete:
    tags:
      - Catalog
    operationId: unfavoriteItem
    summary: Remove an item from the authenticated user's favorites
    security:
      - bearerJwt: []
    parameters:
      - $ref: '../openapi.yaml#/components/parameters/ItemUuid'
    responses:
      '204':
        description: Favorite removed successfully
      '401':
        $ref: '../components/responses/Unauthorized.yaml'
      '404':
        $ref: '../components/responses/NotFound.yaml'
      '429':
        $ref: '../components/responses/TooManyRequests.yaml'

itemArchive:
  post:
    tags:
      - Catalog
    operationId: archiveItem
    summary: Archive an owned item
    security:
      - bearerJwt: []
    parameters:
      - $ref: '../openapi.yaml#/components/parameters/ItemUuid'
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ArchiveItemRequest'
    responses:
      '200':
        description: Item archived successfully
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ItemDetailResponse'
      '400':
        $ref: '../components/responses/BadRequest.yaml'
      '401':
        $ref: '../components/responses/Unauthorized.yaml'
      '403':
        $ref: '../components/responses/Forbidden.yaml'
      '404':
        $ref: '../components/responses/NotFound.yaml'

