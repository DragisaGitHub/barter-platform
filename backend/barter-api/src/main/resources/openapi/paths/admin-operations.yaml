overview:
  get:
    tags:
      - AdminOperations
    operationId: getAdminOperationsOverview
    summary: Get production-safe operational overview for administrators
    description: Returns lightweight aggregate counters and runtime status for admin operational awareness. The response intentionally excludes secrets, raw environment values, user PII lists, filesystem paths, and provider connection details.
    security:
      - bearerJwt: []
    responses:
      '200':
        description: Operational overview returned successfully
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/AdminOperationsOverviewResponse'
      '401':
        $ref: '../components/responses/Unauthorized.yaml'
      '403':
        $ref: '../components/responses/Forbidden.yaml'

backups:
  get:
    tags:
      - AdminOperations
    operationId: getAdminOperationsBackups
    summary: Get backup status for administrators
    description: Returns latest backup metadata from Azure Blob Storage when configured, or a safe placeholder when backup configuration is absent. Never exposes connection strings or storage secrets.
    security:
      - bearerJwt: []
    responses:
      '200':
        description: Backup status returned successfully
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/AdminOperationsBackupsResponse'
      '401':
        $ref: '../components/responses/Unauthorized.yaml'
      '403':
        $ref: '../components/responses/Forbidden.yaml'

deployments:
  get:
    tags:
      - AdminOperations
    operationId: getAdminOperationsDeployments
    summary: Get deployment status for administrators
    description: Returns safe deployment metadata available to the application. Real GitHub Actions integration is not wired yet.
    security:
      - bearerJwt: []
    responses:
      '200':
        description: Deployment status returned successfully
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/AdminOperationsDeploymentsResponse'
      '401':
        $ref: '../components/responses/Unauthorized.yaml'
      '403':
        $ref: '../components/responses/Forbidden.yaml'

costs:
  get:
    tags:
      - AdminOperations
    operationId: getAdminOperationsCosts
    summary: Get Azure cost summary for administrators
    description: Returns Azure Cost Management data when configured, or a safe placeholder when configuration is absent. Never exposes credentials, access tokens, or raw Azure error bodies.
    security:
      - bearerJwt: []
    responses:
      '200':
        description: Cost summary returned successfully
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/AdminOperationsCostsResponse'
      '401':
        $ref: '../components/responses/Unauthorized.yaml'
      '403':
        $ref: '../components/responses/Forbidden.yaml'

monitoring:
  get:
    tags:
      - AdminOperations
    operationId: getAdminOperationsMonitoring
    summary: Get production monitoring snapshot for administrators
    description: Returns a real-time operational snapshot of platform component health, JVM metrics, memory usage, database pool state, HTTP availability, and Azure Blob Storage reachability. All metrics are sourced from Spring Boot Actuator, Java MXBeans, or live infrastructure probes. Metrics that cannot be determined are returned as null with explanatory notes. Never exposes secrets, connection strings, or raw configuration.
    security:
      - bearerJwt: []
    responses:
      '200':
        description: Monitoring snapshot returned successfully
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/AdminOperationsMonitoringResponse'
      '401':
        $ref: '../components/responses/Unauthorized.yaml'
      '403':
        $ref: '../components/responses/Forbidden.yaml'

security:
  get:
    tags:
      - AdminOperations
    operationId: getAdminOperationsSecurity
    summary: Get security posture snapshot for administrators
    description: Returns a production-safe security configuration snapshot. Checks authentication, CORS, storage, backups, email, observability, deployment safety, and edge/header configuration. Status values are OK, WARNING, CRITICAL, or UNKNOWN. Never exposes secrets, connection strings, credentials, or raw sensitive values.
    security:
      - bearerJwt: []
    responses:
      '200':
        description: Security snapshot returned successfully
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/AdminOperationsSecurityResponse'
      '401':
        $ref: '../components/responses/Unauthorized.yaml'
      '403':
        $ref: '../components/responses/Forbidden.yaml'

sentryTest:
  post:
    tags:
      - AdminOperations
    operationId: triggerAdminSystemSentryTest
    summary: Trigger a backend Sentry diagnostics test event
    description: >
      Deliberately throws a RuntimeException to verify that backend Sentry error
      tracking is active and capturing exceptions correctly. Always returns HTTP 500
      by design — this is the intended and expected outcome. Admin-only diagnostic
      operation; safe to use in all environments.
    security:
      - bearerJwt: []
    responses:
      '500':
        description: Sentry test event triggered — this 500 response is intentional and expected
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '401':
        $ref: '../components/responses/Unauthorized.yaml'
      '403':
        $ref: '../components/responses/Forbidden.yaml'

