schemas:
  get:
    tags:
      - AdminCategorySchemas
    operationId: listAdminCategorySchemas
    summary: List category schemas for administrators
    security:
      - bearerJwt: []
    parameters:
      - $ref: '../openapi.yaml#/components/parameters/Page'
      - $ref: '../openapi.yaml#/components/parameters/Size'
      - $ref: '../openapi.yaml#/components/parameters/Sort'
      - name: categoryUuid
        in: query
        required: false
        description: Filter schemas by category.
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        required: false
        description: Filter schemas by status.
        schema:
          $ref: '../openapi.yaml#/components/schemas/CategorySchemaStatus'
      - name: includeDeleted
        in: query
        required: false
        description: Include soft-deleted schemas in the result.
        schema:
          type: boolean
          default: false
    responses:
      '200':
        description: Category schemas returned successfully
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/CategorySchemaPagedResponse'
      '400':
        $ref: '../components/responses/BadRequest.yaml'
      '401':
        $ref: '../components/responses/Unauthorized.yaml'
      '403':
        $ref: '../components/responses/Forbidden.yaml'

schemasByCategory:
  post:
    tags:
      - AdminCategorySchemas
    operationId: createAdminCategorySchema
    summary: Create a new schema version for a category
    security:
      - bearerJwt: []
    parameters:
      - name: categoryUuid
        in: path
        required: true
        description: Category UUID.
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/CreateCategorySchemaRequest'
    responses:
      '201':
        description: Category schema created successfully
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/CategorySchemaResponse'
      '400':
        $ref: '../components/responses/BadRequest.yaml'
      '401':
        $ref: '../components/responses/Unauthorized.yaml'
      '403':
        $ref: '../components/responses/Forbidden.yaml'
      '404':
        $ref: '../components/responses/NotFound.yaml'
      '409':
        $ref: '../components/responses/Conflict.yaml'

