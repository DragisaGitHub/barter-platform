openapi: 3.0.3
info:
  title: Barter Platform API
  version: 0.1.0
servers:
  - url: /api/v1
tags:
  - name: Auth
    description: Authentication and session management operations
  - name: Users
    description: User management operations
  - name: Roles
    description: Role lookup operations
  - name: Permissions
    description: Permission lookup operations
  - name: Mfa
    description: Multi-factor authentication operations
  - name: OAuth
    description: OAuth provider and account operations
  - name: System
    description: Placeholder system operations for generator validation
  - name: Catalog
    description: Catalog browsing, item listings, and item management
  - name: TradeOffers
    description: Trade offer creation, listing, and lifecycle management
  - name: Notifications
    description: In-app notification listing and read management
  - name: Profiles
    description: Public user profiles and trust information
paths:
  /auth/register:
    $ref: './paths/auth.yaml#/register'
  /auth/login:
    $ref: './paths/auth.yaml#/login'
  /auth/refresh:
    $ref: './paths/auth.yaml#/refresh'
  /auth/logout:
    $ref: './paths/auth.yaml#/logout'
  /auth/verify-email:
    $ref: './paths/auth.yaml#/verifyEmail'
  /auth/resend-verification-code:
    $ref: './paths/auth.yaml#/resendVerificationCode'
  /auth/me:
    $ref: './paths/auth.yaml#/me'
  /users:
    $ref: './paths/users.yaml#/list'
  /users/{userUuid}:
    $ref: './paths/users.yaml#/byUuid'
  /users/{userUuid}/status:
    $ref: './paths/users.yaml#/status'
  /roles:
    $ref: './paths/roles.yaml#/list'
  /roles/{code}:
    $ref: './paths/roles.yaml#/byCode'
  /permissions:
    $ref: './paths/permissions.yaml#/list'
  /mfa/settings:
    $ref: './paths/mfa.yaml#/settings'
  /mfa/setup:
    $ref: './paths/mfa.yaml#/setup'
  /mfa/verify:
    $ref: './paths/mfa.yaml#/verify'
  /mfa/disable:
    $ref: './paths/mfa.yaml#/disable'
  /mfa/recovery-codes:
    $ref: './paths/mfa.yaml#/recoveryCodes'
  /oauth/providers:
    $ref: './paths/oauth.yaml#/providers'
  /oauth/accounts:
    $ref: './paths/oauth.yaml#/accounts'
  /catalog/categories:
    $ref: './paths/catalog.yaml#/categories'
  /catalog/tags:
    $ref: './paths/catalog.yaml#/tags'
  /catalog/items:
    $ref: './paths/catalog.yaml#/items'
  /catalog/items/mine:
    $ref: './paths/catalog.yaml#/itemsMine'
  /catalog/items/{itemUuid}:
    $ref: './paths/catalog.yaml#/itemByUuid'
  /catalog/items/{itemUuid}/archive:
    $ref: './paths/catalog.yaml#/itemArchive'
  /catalog/items/{itemUuid}/images:
    $ref: './paths/catalog-images.yaml#/itemImages'
  /catalog/items/{itemUuid}/images/{imageUuid}:
    $ref: './paths/catalog-images.yaml#/itemImageByUuid'
  /catalog/items/{itemUuid}/images/{imageUuid}/primary:
    $ref: './paths/catalog-images.yaml#/itemImagePrimary'
  /trade-offers:
    $ref: './paths/trade-offers.yaml#/create'
  /trade-offers/incoming:
    $ref: './paths/trade-offers.yaml#/incoming'
  /trade-offers/sent:
    $ref: './paths/trade-offers.yaml#/sent'
  /trade-offers/{tradeOfferUuid}:
    $ref: './paths/trade-offers.yaml#/byUuid'
  /trade-offers/{tradeOfferUuid}/accept:
    $ref: './paths/trade-offers.yaml#/accept'
  /trade-offers/{tradeOfferUuid}/reject:
    $ref: './paths/trade-offers.yaml#/reject'
  /trade-offers/{tradeOfferUuid}/cancel:
    $ref: './paths/trade-offers.yaml#/cancel'
  /notifications:
    $ref: './paths/notifications.yaml#/list'
  /notifications/unread-count:
    $ref: './paths/notifications.yaml#/unreadCount'
  /notifications/read-all:
    $ref: './paths/notifications.yaml#/markAllRead'
  /notifications/{notificationUuid}/read:
    $ref: './paths/notifications.yaml#/markRead'
  /profiles/{userUuid}:
    $ref: './paths/profiles.yaml#/byUuid'
  /profiles/{userUuid}/items:
    $ref: './paths/profiles.yaml#/items'
  /ping:
    $ref: './paths/system.yaml'
components:
  securitySchemes:
    bearerJwt:
      $ref: './components/security/bearer-jwt.yaml'
  schemas:
    PingResponse:
      $ref: './components/schemas/PingResponse.yaml'
    FieldErrorResponse:
      $ref: './components/schemas/FieldErrorResponse.yaml'
    ErrorResponse:
      $ref: './components/schemas/ErrorResponse.yaml'
    PageMetadata:
      $ref: './components/schemas/PageMetadata.yaml'
    UserStatus:
      $ref: './components/schemas/UserStatus.yaml'
    RoleCode:
      $ref: './components/schemas/RoleCode.yaml'
    PermissionCode:
      $ref: './components/schemas/PermissionCode.yaml'
    OAuthProvider:
      $ref: './components/schemas/OAuthProvider.yaml'
    RoleResponse:
      $ref: './components/schemas/RoleResponse.yaml'
    PermissionResponse:
      $ref: './components/schemas/PermissionResponse.yaml'
    UserSummaryResponse:
      $ref: './components/schemas/UserSummaryResponse.yaml'
    UserPagedResponse:
      $ref: './components/schemas/UserPagedResponse.yaml'
    UserResponse:
      $ref: './components/schemas/UserResponse.yaml'
    OAuthProviderResponse:
      $ref: './components/schemas/OAuthProviderResponse.yaml'
    OAuthAccountResponse:
      $ref: './components/schemas/OAuthAccountResponse.yaml'
    MfaSettingsResponse:
      $ref: './components/schemas/MfaSettingsResponse.yaml'
    MfaSetupResponse:
      $ref: './components/schemas/MfaSetupResponse.yaml'
    MfaRecoveryCodeResponse:
      $ref: './components/schemas/MfaRecoveryCodeResponse.yaml'
    CurrentUserResponse:
      $ref: './components/schemas/CurrentUserResponse.yaml'
    TokenResponse:
      $ref: './components/schemas/TokenResponse.yaml'
    MessageResponse:
      $ref: './components/schemas/MessageResponse.yaml'
    ItemStatus:
      $ref: './components/schemas/catalog/ItemStatus.yaml'
    ItemCondition:
      $ref: './components/schemas/catalog/ItemCondition.yaml'
    CategoryResponse:
      $ref: './components/schemas/catalog/CategoryResponse.yaml'
    TagResponse:
      $ref: './components/schemas/catalog/TagResponse.yaml'
    ItemSummaryResponse:
      $ref: './components/schemas/catalog/ItemSummaryResponse.yaml'
    ItemDetailResponse:
      $ref: './components/schemas/catalog/ItemDetailResponse.yaml'
    ItemPagedResponse:
      $ref: './components/schemas/catalog/ItemPagedResponse.yaml'
    CreateItemRequest:
      $ref: './components/schemas/catalog/CreateItemRequest.yaml'
    UpdateItemRequest:
      $ref: './components/schemas/catalog/UpdateItemRequest.yaml'
    ArchiveItemRequest:
      $ref: './components/schemas/catalog/ArchiveItemRequest.yaml'
    ItemImageResponse:
      $ref: './components/schemas/catalog/ItemImageResponse.yaml'
    TradeOfferStatus:
      $ref: './components/schemas/trade/TradeOfferStatus.yaml'
    TradeOfferMode:
      $ref: './components/schemas/trade/TradeOfferMode.yaml'
    CreateTradeOfferRequest:
      $ref: './components/schemas/trade/CreateTradeOfferRequest.yaml'
    TradeOfferUserSummary:
      $ref: './components/schemas/trade/TradeOfferUserSummary.yaml'
    TradeOfferItemSummary:
      $ref: './components/schemas/trade/TradeOfferItemSummary.yaml'
    TradeOfferSummaryResponse:
      $ref: './components/schemas/trade/TradeOfferSummaryResponse.yaml'
    TradeOfferResponse:
      $ref: './components/schemas/trade/TradeOfferResponse.yaml'
    TradeOfferPagedResponse:
      $ref: './components/schemas/trade/TradeOfferPagedResponse.yaml'
    NotificationType:
      $ref: './components/schemas/notification/NotificationType.yaml'
    NotificationResponse:
      $ref: './components/schemas/notification/NotificationResponse.yaml'
    NotificationPagedResponse:
      $ref: './components/schemas/notification/NotificationPagedResponse.yaml'
    NotificationUnreadCountResponse:
      $ref: './components/schemas/notification/NotificationUnreadCountResponse.yaml'
    PublicProfileResponse:
      $ref: './components/schemas/profile/PublicProfileResponse.yaml'
  requestBodies:
    RegisterUserRequest:
      content:
        application/json:
          schema:
            $ref: './components/requests/RegisterUserRequest.yaml'
    LoginRequest:
      content:
        application/json:
          schema:
            $ref: './components/requests/LoginRequest.yaml'
    RefreshTokenRequest:
      content:
        application/json:
          schema:
            $ref: './components/requests/RefreshTokenRequest.yaml'
    UpdateUserStatusRequest:
      content:
        application/json:
          schema:
            $ref: './components/requests/UpdateUserStatusRequest.yaml'
    VerifyEmailRequest:
      content:
        application/json:
          schema:
            $ref: './components/requests/VerifyEmailRequest.yaml'
    ResendVerificationCodeRequest:
      content:
        application/json:
          schema:
            $ref: './components/requests/ResendVerificationCodeRequest.yaml'
    MfaVerifyRequest:
      content:
        application/json:
          schema:
            $ref: './components/requests/MfaVerifyRequest.yaml'
  parameters:
    Page:
      $ref: './components/parameters/Page.yaml#/Page'
    Size:
      $ref: './components/parameters/Size.yaml#/Size'
    Sort:
      $ref: './components/parameters/Sort.yaml#/Sort'
    UserUuid:
      $ref: './components/parameters/UserUuid.yaml#/UserUuid'
    RoleCodeParameter:
      $ref: './components/parameters/RoleCode.yaml#/RoleCodeParameter'
    ItemUuid:
      $ref: './components/parameters/ItemUuid.yaml#/ItemUuid'
    TradeOfferUuid:
      $ref: './components/parameters/trade/TradeOfferUuid.yaml#/TradeOfferUuid'
    NotificationUuid:
      $ref: './components/parameters/notification/NotificationUuid.yaml#/NotificationUuid'
    ImageUuid:
      $ref: './components/parameters/catalog/ImageUuid.yaml#/ImageUuid'
  responses:
    BadRequest:
      $ref: './components/responses/BadRequest.yaml'
    Unauthorized:
      $ref: './components/responses/Unauthorized.yaml'
    Forbidden:
      $ref: './components/responses/Forbidden.yaml'
    NotFound:
      $ref: './components/responses/NotFound.yaml'
    Conflict:
      $ref: './components/responses/Conflict.yaml'
    InternalServerError:
      $ref: './components/responses/InternalServerError.yaml'

