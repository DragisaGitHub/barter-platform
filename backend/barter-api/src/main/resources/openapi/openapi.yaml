openapi: 3.0.3
info:
  title: Barter Platform API
  version: 0.1.0
servers:
  - url: /api/v1
tags:
  - name: Auth
    description: Authentication and session management operations
  - name: Users
    description: User management operations
  - name: Roles
    description: Role lookup operations
  - name: Permissions
    description: Permission lookup operations
  - name: Mfa
    description: Multi-factor authentication operations
  - name: OAuth
    description: OAuth provider and account operations
  - name: System
    description: Placeholder system operations for generator validation
  - name: Catalog
    description: Catalog browsing, item listings, and item management
  - name: SavedSearches
    description: Authenticated saved catalog search management
  - name: Feedback
    description: Authenticated product feedback submission operations
  - name: AdminCategories
    description: Administrator category management operations
  - name: AdminListings
    description: Administrator listing moderation and governance operations
  - name: AdminReviews
    description: Administrator trade review governance operations
  - name: Reports
    description: User-facing moderation report submission operations
  - name: AdminReports
    description: Staff moderation report triage and review operations
  - name: AdminOperations
    description: Administrator operational overview and runtime awareness operations
  - name: TradeOffers
    description: Trade offer creation, listing, and lifecycle management
  - name: Reviews
    description: User-facing trade review history operations
  - name: Notifications
    description: In-app notification listing and read management
  - name: Profiles
    description: Public user profiles and trust information
