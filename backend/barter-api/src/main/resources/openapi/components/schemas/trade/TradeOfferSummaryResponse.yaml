type: object
additionalProperties: false
required:
  - uuid
  - status
  - mode
  - sender
  - receiver
  - receiverItem
  - offeredItems
  - createdAt
  - canCurrentUserReview
  - currentUserHasReviewed
  - counterpartyHasReviewed
properties:
  uuid:
    type: string
    format: uuid
  status:
    $ref: '../../../openapi.yaml#/components/schemas/TradeOfferStatus'
  mode:
    $ref: '../../../openapi.yaml#/components/schemas/TradeOfferMode'
  message:
    type: string
    nullable: true
  sender:
    $ref: '../../../openapi.yaml#/components/schemas/TradeOfferUserSummary'
  receiver:
    $ref: '../../../openapi.yaml#/components/schemas/TradeOfferUserSummary'
  senderItem:
    $ref: '../../../openapi.yaml#/components/schemas/TradeOfferItemSummary'
    description: "Deprecated: first offered item for backward compatibility. Use offeredItems instead."
    nullable: true
  receiverItem:
    $ref: '../../../openapi.yaml#/components/schemas/TradeOfferItemSummary'
  offeredItems:
    type: array
    items:
      $ref: '../../../openapi.yaml#/components/schemas/TradeOfferItemSummary'
    description: Items offered by the sender. Empty for GIFT mode.
  requestedEntries:
    type: array
    items:
      $ref: '../../../openapi.yaml#/components/schemas/ItemListingEntryResponse'
    description: Selected child entries from the requested listing for PICK_ANY-based offers.
  createdAt:
    type: string
    format: date-time
  respondedAt:
    type: string
    format: date-time
    nullable: true
  senderCompletedAt:
    type: string
    format: date-time
    nullable: true
  receiverCompletedAt:
    type: string
    format: date-time
    nullable: true
  completedAt:
    type: string
    format: date-time
    nullable: true
  currentUserCompletionConfirmed:
    type: boolean
  canConfirmCompletion:
    type: boolean
  canCurrentUserReview:
    type: boolean
  currentUserHasReviewed:
    type: boolean
  counterpartyHasReviewed:
    type: boolean
