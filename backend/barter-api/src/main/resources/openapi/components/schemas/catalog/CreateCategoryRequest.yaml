type: object
additionalProperties: false
required:
  - name
properties:
  name:
    type: string
    minLength: 1
    maxLength: 120
  slug:
    type: string
    minLength: 1
    maxLength: 140
    nullable: true
  description:
    type: string
    nullable: true
  parentUuid:
    type: string
    format: uuid
    nullable: true
  sortOrder:
    type: integer
    format: int32
    default: 0

