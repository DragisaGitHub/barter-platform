type: object
additionalProperties: false
required:
  - uuid
  - status
  - mode
  - sender
  - receiver
  - receiverItem
  - offeredItems
  - createdAt
properties:
  uuid:
    type: string
    format: uuid
  status:
    $ref: '../../../openapi.yaml#/components/schemas/TradeOfferStatus'
  mode:
    $ref: '../../../openapi.yaml#/components/schemas/TradeOfferMode'
  message:
    type: string
    nullable: true
  sender:
    $ref: '../../../openapi.yaml#/components/schemas/TradeOfferUserSummary'
  receiver:
    $ref: '../../../openapi.yaml#/components/schemas/TradeOfferUserSummary'
  senderItem:
    $ref: '../../../openapi.yaml#/components/schemas/TradeOfferItemSummary'
    description: "Deprecated: first offered item for backward compatibility. Use offeredItems instead."
    nullable: true
  receiverItem:
    $ref: '../../../openapi.yaml#/components/schemas/TradeOfferItemSummary'
  offeredItems:
    type: array
    items:
      $ref: '../../../openapi.yaml#/components/schemas/TradeOfferItemSummary'
    description: Items offered by the sender. Empty for GIFT mode.
  createdAt:
    type: string
    format: date-time
  respondedAt:
    type: string
    format: date-time
    nullable: true
  expiresAt:
    type: string
    format: date-time
    nullable: true
