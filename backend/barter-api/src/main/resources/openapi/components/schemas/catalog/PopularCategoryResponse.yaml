type: object
additionalProperties: false
required:
  - uuid
  - name
  - slug
  - sortOrder
  - activeItemCount
properties:
  uuid:
    type: string
    format: uuid
  name:
    type: string
    maxLength: 120
  slug:
    type: string
    maxLength: 140
  description:
    type: string
    nullable: true
  sortOrder:
    type: integer
    format: int32
  activeItemCount:
    type: integer
    format: int64

