type: object
additionalProperties: false
required:
  - uuid
  - title
  - status
  - condition
  - category
  - tags
  - ownerUuid
  - ownerUsername
  - createdAt
  - images
properties:
  uuid:
    type: string
    format: uuid
  title:
    type: string
    maxLength: 255
  description:
    type: string
    nullable: true
  status:
    $ref: '../../../openapi.yaml#/components/schemas/ItemStatus'
  condition:
    $ref: '../../../openapi.yaml#/components/schemas/ItemCondition'
  listingMode:
    $ref: '../../../openapi.yaml#/components/schemas/ListingMode'
  listingTemplateType:
    $ref: '../../../openapi.yaml#/components/schemas/ListingTemplateType'
  templateMetadata:
    $ref: '../../../openapi.yaml#/components/schemas/ListingTemplateMetadata'
  category:
    $ref: '../../../openapi.yaml#/components/schemas/CategoryResponse'
  tags:
    type: array
    items:
      $ref: '../../../openapi.yaml#/components/schemas/TagResponse'
  ownerUuid:
    type: string
    format: uuid
  ownerUsername:
    type: string
  primaryImageUrl:
    type: string
    nullable: true
  exchangeLocation:
    type: string
    nullable: true
    maxLength: 255
    description: Coarse public exchange location label only; never an exact private address.
  exchangeCity:
    type: string
    nullable: true
    maxLength: 120
  exchangeArea:
    type: string
    nullable: true
    maxLength: 120
  images:
    type: array
    items:
      $ref: '../../../openapi.yaml#/components/schemas/ItemImageResponse'
  entries:
    type: array
    maxItems: 20
    items:
      $ref: '../../../openapi.yaml#/components/schemas/ItemListingEntryResponse'
  createdAt:
    type: string
    format: date-time
  updatedAt:
    type: string
    format: date-time
    nullable: true
  archivedAt:
    type: string
    format: date-time
    nullable: true
  removedAt:
    type: string
    format: date-time
    nullable: true
  moderationSummary:
    $ref: '../../../openapi.yaml#/components/schemas/OwnerListingModerationSummary'
