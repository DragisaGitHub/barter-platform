type: object
additionalProperties: false
required:
  - uuid
  - value
  - label
  - displayOrder
  - deleted
  - createdAt
properties:
  uuid:
    type: string
    format: uuid
  value:
    type: string
    maxLength: 100
  label:
    type: string
    maxLength: 160
  labelSr:
    type: string
    maxLength: 160
    nullable: true
  displayOrder:
    type: integer
    format: int32
  deleted:
    type: boolean
  createdAt:
    type: string
    format: date-time
  updatedAt:
    type: string
    format: date-time
    nullable: true
  deletedAt:
    type: string
    format: date-time
    nullable: true

