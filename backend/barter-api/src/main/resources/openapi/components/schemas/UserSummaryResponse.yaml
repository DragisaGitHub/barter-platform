type: object
additionalProperties: false
required:
  - uuid
  - username
  - email
  - status
  - emailVerified
  - mfaEnabled
  - createdAt
properties:
  uuid:
    type: string
    format: uuid
  username:
    type: string
    minLength: 3
    maxLength: 80
  email:
    type: string
    format: email
    maxLength: 255
  status:
    $ref: './UserStatus.yaml'
  emailVerified:
    type: boolean
  mfaEnabled:
    type: boolean
  lastLoginAt:
    type: string
    format: date-time
    nullable: true
  createdAt:
    type: string
    format: date-time
  updatedAt:
    type: string
    format: date-time
    nullable: true

