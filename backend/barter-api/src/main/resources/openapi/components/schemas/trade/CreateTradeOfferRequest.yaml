type: object
additionalProperties: false
required:
  - receiverItemUuid
  - mode
properties:
  receiverItemUuid:
    type: string
    format: uuid
    description: UUID of the item the sender wants. Derives the receiver user.
  senderItemUuids:
    type: array
    items:
      type: string
      format: uuid
    description: >
      UUIDs of items offered by the sender. Required for ITEM_EXCHANGE (at least one),
      forbidden for GIFT, optional for NEGOTIABLE. All must belong to the authenticated user
      and be ACTIVE.
  requestedEntryUuids:
    type: array
    items:
      type: string
      format: uuid
    description: >
      Selected child entry UUIDs from the requested listing. Supported only when the
      requested item uses a PICK_ANY-based listing mode. Must belong to the requested listing.
  mode:
    $ref: '../../../openapi.yaml#/components/schemas/TradeOfferMode'
  message:
    type: string
    maxLength: 1000
    description: >
      Optional message from sender to receiver.
      Required for GIFT and NEGOTIABLE modes to explain the arrangement.
