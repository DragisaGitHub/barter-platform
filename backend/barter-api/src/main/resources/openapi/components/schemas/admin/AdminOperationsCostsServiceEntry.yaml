type: object
additionalProperties: false
required:
  - serviceName
  - cost
  - currency
properties:
  serviceName:
    type: string
    description: Azure service or meter category name.
  cost:
    type: number
    format: double
    description: Total cost for this service in the queried period.
  currency:
    type: string
    description: Currency code, e.g. USD.

