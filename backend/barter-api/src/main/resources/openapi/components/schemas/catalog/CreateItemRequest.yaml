type: object
additionalProperties: false
required:
  - title
  - categoryUuid
  - condition
properties:
  title:
    type: string
    minLength: 1
    maxLength: 255
  description:
    type: string
  exchangeLocation:
    type: string
    maxLength: 255
    description: Optional coarse public exchange location label. Do not include exact home addresses.
  exchangeCity:
    type: string
    maxLength: 120
    description: Optional approximate city for public exchange discovery.
  exchangeArea:
    type: string
    maxLength: 120
    description: Optional neighborhood or area label for public exchange discovery; avoid exact addresses.
  categoryUuid:
    type: string
    format: uuid
  tagUuids:
    type: array
    items:
      type: string
      format: uuid
  condition:
    $ref: '../../../openapi.yaml#/components/schemas/ItemCondition'
  listingMode:
    $ref: '../../../openapi.yaml#/components/schemas/ListingMode'
    description: Defaults to SINGLE when omitted.
  listingTemplateType:
    $ref: '../../../openapi.yaml#/components/schemas/ListingTemplateType'
    description: Optional template overlay. When omitted, compatible defaults are inferred from listingMode.
  templateMetadata:
    $ref: '../../../openapi.yaml#/components/schemas/ListingTemplateMetadata'
    description: Optional template-specific metadata. Unsupported fields are rejected.
  entries:
    type: array
    maxItems: 20
    items:
      $ref: '../../../openapi.yaml#/components/schemas/ItemListingEntryRequest'
  status:
    $ref: '../../../openapi.yaml#/components/schemas/ItemStatus'
    description: Optional initial status. Defaults to DRAFT if omitted.
  schemaFieldValues:
    type: array
    description: Dynamic category-schema field values. Only fields from the category's ACTIVE schema are accepted.
    items:
      $ref: '../../../openapi.yaml#/components/schemas/SchemaFieldValueRequest'

