type: object
additionalProperties: false
required:
  - title
  - categoryUuid
  - condition
properties:
  title:
    type: string
    minLength: 1
    maxLength: 255
  description:
    type: string
  categoryUuid:
    type: string
    format: uuid
  tagUuids:
    type: array
    items:
      type: string
      format: uuid
  condition:
    $ref: '../../../openapi.yaml#/components/schemas/ItemCondition'
  status:
    $ref: '../../../openapi.yaml#/components/schemas/ItemStatus'
    description: Optional initial status. Defaults to DRAFT if omitted.

