type: object
additionalProperties: false
properties:
  title:
    type: string
    minLength: 1
    maxLength: 255
  description:
    type: string
  exchangeLocation:
    type: string
    maxLength: 255
    description: Optional coarse public exchange location label. Do not include exact home addresses.
  exchangeCity:
    type: string
    maxLength: 120
    description: Optional approximate city for public exchange discovery.
  exchangeArea:
    type: string
    maxLength: 120
    description: Optional neighborhood or area label for public exchange discovery; avoid exact addresses.
  categoryUuid:
    type: string
    format: uuid
  tagUuids:
    type: array
    items:
      type: string
      format: uuid
  condition:
    $ref: '../../../openapi.yaml#/components/schemas/ItemCondition'
  listingMode:
    $ref: '../../../openapi.yaml#/components/schemas/ListingMode'
  entries:
    type: array
    maxItems: 20
    description: When provided, replaces the full structured entry list for this listing.
    items:
      $ref: '../../../openapi.yaml#/components/schemas/ItemListingEntryRequest'
  status:
    $ref: '../../../openapi.yaml#/components/schemas/ItemStatus'
    description: Only DRAFT and ACTIVE transitions are allowed by the owner.

