type: object
additionalProperties: false
required:
  - uuid
  - title
  - status
  - condition
  - categoryUuid
  - categoryName
  - ownerUuid
  - ownerUsername
  - createdAt
properties:
  uuid:
    type: string
    format: uuid
  title:
    type: string
    maxLength: 255
  status:
    $ref: '../../../openapi.yaml#/components/schemas/ItemStatus'
  condition:
    $ref: '../../../openapi.yaml#/components/schemas/ItemCondition'
  listingMode:
    $ref: '../../../openapi.yaml#/components/schemas/ListingMode'
  entryCount:
    type: integer
    format: int32
    minimum: 0
    default: 0
  previewEntries:
    type: array
    maxItems: 3
    items:
      $ref: '../../../openapi.yaml#/components/schemas/ItemListingEntryResponse'
  categoryUuid:
    type: string
    format: uuid
  categoryName:
    type: string
  ownerUuid:
    type: string
    format: uuid
  ownerUsername:
    type: string
  primaryImageUrl:
    type: string
    nullable: true
  exchangeLocation:
    type: string
    nullable: true
    maxLength: 255
    description: Coarse public exchange location label only; never an exact private address.
  exchangeCity:
    type: string
    nullable: true
    maxLength: 120
  exchangeArea:
    type: string
    nullable: true
    maxLength: 120
  createdAt:
    type: string
    format: date-time
