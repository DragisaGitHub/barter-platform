type: object
additionalProperties: false
required:
  - identifier
  - password
properties:
  identifier:
    type: string
    minLength: 3
    maxLength: 255
    description: Username or email address.
    example: alex@example.com
  password:
    type: string
    minLength: 8
    maxLength: 128
    format: password
  mfaCode:
    type: string
    minLength: 6
    maxLength: 8
    pattern: '^[0-9]{6,8}$'
    nullable: true
    description: Optional one-time MFA code for second-factor login.

