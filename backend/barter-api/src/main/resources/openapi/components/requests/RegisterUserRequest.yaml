type: object
additionalProperties: false
required:
  - username
  - email
  - password
properties:
  username:
    type: string
    minLength: 3
    maxLength: 80
    pattern: '^[A-Za-z0-9](?:[A-Za-z0-9_.-]{1,78}[A-Za-z0-9])?$'
    example: alex99
  email:
    type: string
    format: email
    maxLength: 255
    example: alex@example.com
  password:
    type: string
    minLength: 8
    maxLength: 128
    format: password

