plugins {
    id 'java-library'
    id 'org.openapi.generator'
}

dependencies {
    implementation project(':barter-common')

    api 'org.springframework:spring-web'
    api 'org.springframework:spring-context'
    api 'jakarta.validation:jakarta.validation-api'
    api 'jakarta.annotation:jakarta.annotation-api'
    api 'jakarta.servlet:jakarta.servlet-api'
    api 'io.swagger.core.v3:swagger-annotations-jakarta:2.2.29'
    api 'com.fasterxml.jackson.core:jackson-annotations:2.19.0'
}

openApiGenerate {
    generatorName = 'spring'
    inputSpec = "$projectDir/src/main/resources/openapi/openapi.yaml"
    outputDir = layout.buildDirectory.dir("generated/openapi").get().asFile.absolutePath
    apiPackage = 'com.barterplatform.api.controller'
    modelPackage = 'com.barterplatform.api.model'
    invokerPackage = 'com.barterplatform.api.invoker'
    generateModelTests = false
    generateApiTests = false
    configOptions = [
        interfaceOnly       : 'true',
        useSpringBoot3      : 'true',
        useJakartaEe        : 'true',
        useTags             : 'true',
        openApiNullable     : 'false',
        delegatePattern     : 'false',
        hideGenerationTimestamp: 'true'
    ]
}

sourceSets.main.java.srcDir layout.buildDirectory.dir("generated/openapi/src/main/java")

tasks.named('compileJava') {
    dependsOn tasks.named('openApiGenerate')
}

