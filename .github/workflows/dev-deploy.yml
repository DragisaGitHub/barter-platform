name: DEV Deploy

on:
  workflow_dispatch:

run-name: DEV deploy by @${{ github.actor }}

permissions:
  contents: read
  actions: read

concurrency:
  group: dev-deploy
  cancel-in-progress: false

jobs:
  deploy-dev:
    name: Deploy DEV from main
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    env:
      DEPLOY_REF: main
      DEV_SSH_HOST: ${{ vars.DEV_SSH_HOST || secrets.DEV_SSH_HOST }}
      DEV_SSH_PORT: ${{ vars.DEV_SSH_PORT || secrets.DEV_SSH_PORT || '22' }}
      DEV_SSH_USER: ${{ vars.DEV_SSH_USER || secrets.DEV_SSH_USER }}
      DEV_DEPLOY_PATH: ${{ vars.DEV_DEPLOY_PATH || secrets.DEV_DEPLOY_PATH }}
      DEV_SSH_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS || vars.DEV_SSH_KNOWN_HOSTS }}

    steps:
      - name: Log deployment context
        run: |
          echo "Actor: ${GITHUB_ACTOR}"
          echo "Workflow ref: ${GITHUB_REF}"
          echo "Target deploy ref: ${DEPLOY_REF}"
          echo "Run started at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Validate required DEV deployment configuration
        env:
          DEV_SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          missing=()

          [[ -n "${DEV_SSH_HOST}" ]] || missing+=("DEV_SSH_HOST")
          [[ -n "${DEV_SSH_USER}" ]] || missing+=("DEV_SSH_USER")
          [[ -n "${DEV_SSH_PRIVATE_KEY}" ]] || missing+=("DEV_SSH_PRIVATE_KEY")
          [[ -n "${DEV_DEPLOY_PATH}" ]] || missing+=("DEV_DEPLOY_PATH")

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required DEV deployment configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Resolve target main commit
        id: target-commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          api_path="repos/${GITHUB_REPOSITORY}/branches/${DEPLOY_REF}"

          if command -v gh >/dev/null 2>&1; then
            response="$(gh api "/${api_path}")"
          else
            response="$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/${api_path}")"
          fi

          deploy_sha="$(jq -r '.commit.sha // empty' <<<"${response}")"

          if [[ -z "${deploy_sha}" ]]; then
            echo "Unable to resolve the current ${DEPLOY_REF} commit SHA." >&2
            exit 1
          fi

          echo "sha=${deploy_sha}" >> "${GITHUB_OUTPUT}"
          echo "Resolved ${DEPLOY_REF} HEAD for deployment: ${deploy_sha}"

      - name: Verify CI succeeded for target commit
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ steps.target-commit.outputs.sha }}
        run: |
          set -euo pipefail

          api_path="repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=${DEPLOY_REF}&event=push&head_sha=${DEPLOY_SHA}&per_page=10"

          if command -v gh >/dev/null 2>&1; then
            response="$(gh api "/${api_path}")"
          else
            response="$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/${api_path}")"
          fi

          run_count="$(jq '.workflow_runs | length' <<<"${response}")"

          if [[ "${run_count}" -eq 0 ]]; then
            echo "DEV Deploy blocked: no CI push run was found for ${DEPLOY_REF} commit ${DEPLOY_SHA}." >&2
            exit 1
          fi

          run_status="$(jq -r '.workflow_runs[0].status // empty' <<<"${response}")"
          run_conclusion="$(jq -r '.workflow_runs[0].conclusion // empty' <<<"${response}")"
          run_html_url="$(jq -r '.workflow_runs[0].html_url // empty' <<<"${response}")"
          run_display_title="$(jq -r '.workflow_runs[0].display_title // empty' <<<"${response}")"

          echo "Latest CI run for ${DEPLOY_SHA}: status=${run_status}, conclusion=${run_conclusion}"
          [[ -n "${run_html_url}" ]] && echo "CI run: ${run_html_url}"

          if [[ "${run_status}" != "completed" ]]; then
            echo "DEV Deploy blocked: CI for ${DEPLOY_REF} commit ${DEPLOY_SHA} is still ${run_status}. Wait for it to finish successfully before deploying.${run_html_url:+ See ${run_html_url}}" >&2
            exit 1
          fi

          if [[ "${run_conclusion}" != "success" ]]; then
            echo "DEV Deploy blocked: CI for ${DEPLOY_REF} commit ${DEPLOY_SHA} finished with conclusion '${run_conclusion:-unknown}', not 'success'.${run_display_title:+ Run: ${run_display_title}.}${run_html_url:+ See ${run_html_url}}" >&2
            exit 1
          fi

          echo "CI is green for ${DEPLOY_REF} commit ${DEPLOY_SHA}; DEV Deploy may continue."

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}

      - name: Configure SSH host verification
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          if [[ -n "${DEV_SSH_KNOWN_HOSTS}" ]]; then
            printf '%s\n' "${DEV_SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
            echo "Using configured DEV_SSH_KNOWN_HOSTS entries."
          else
            ssh-keyscan -p "${DEV_SSH_PORT}" -H "${DEV_SSH_HOST}" >> ~/.ssh/known_hosts 2>/dev/null
            echo "DEV_SSH_KNOWN_HOSTS not set; loaded the current host key with ssh-keyscan."
          fi

      - name: Deploy on DEV server
        env:
          DEPLOY_SHA: ${{ steps.target-commit.outputs.sha }}
        run: |
          set -euo pipefail

          printf -v DEPLOY_PATH_Q '%q' "${DEV_DEPLOY_PATH}"
          printf -v DEPLOY_SHA_Q '%q' "${DEPLOY_SHA}"

          ssh \
            -p "${DEV_SSH_PORT}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${DEV_SSH_USER}@${DEV_SSH_HOST}" \
            "export DEV_DEPLOY_PATH=${DEPLOY_PATH_Q}; export DEPLOY_SHA=${DEPLOY_SHA_Q}; bash -se" <<'EOF'
          set -euo pipefail

          cd "$DEV_DEPLOY_PATH"
          git fetch origin main

          if ! git rev-parse --verify "${DEPLOY_SHA}^{commit}" >/dev/null 2>&1; then
            echo "Resolved deployment commit ${DEPLOY_SHA} is not available on the DEV server after fetching origin/main." >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "${DEPLOY_SHA}" origin/main; then
            echo "Resolved deployment commit ${DEPLOY_SHA} is no longer contained in origin/main; aborting DEV deploy." >&2
            exit 1
          fi

          git reset --hard "$DEPLOY_SHA"
          chmod +x deployment/scripts/*.sh
          ./deployment/scripts/backup-db.sh --force
          echo "Backup completed successfully; continuing with DEV deployment."
          ./deployment/scripts/deploy-dev.sh
          EOF

      - name: Log completion
        if: always()
        run: |
          echo "Run finished with status: ${{ job.status }}"
          echo "Run completed at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
