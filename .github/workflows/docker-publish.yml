name: Docker Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  BACKEND_IMAGE: dragisahub1984/barter-backend
  FRONTEND_IMAGE: dragisahub1984/barter-frontend
  LANDING_IMAGE: dragisahub1984/barter-landing
  CADDY_IMAGE: dragisahub1984/barter-caddy

jobs:
  validate-release-ref:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - name: Require a stable version tag
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF}" =~ ^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Docker Publish must run against a stable vMAJOR.MINOR.PATCH tag."
            exit 1
          fi

  build-and-push-backend:
    name: Build and push backend image
    runs-on: ubuntu-latest
    needs: validate-release-ref
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract backend Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.BACKEND_IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deployment/docker/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-caddy:
    name: Build and push CA-remediated Caddy image
    runs-on: ubuntu-latest
    needs: validate-release-ref
    if: startsWith(github.ref, 'refs/tags/v')
    outputs:
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Caddy image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.CADDY_IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}

      - name: Build and push CA-remediated Caddy image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: deployment/docker/caddy
          file: deployment/docker/caddy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record immutable Caddy identity
        run: |
          {
            echo '### CA-remediated Caddy image'
            echo
            echo 'Platform: `linux/amd64`'
            echo 'Image: `${{ env.CADDY_IMAGE }}@${{ steps.push.outputs.digest }}`'
          } >> "${GITHUB_STEP_SUMMARY}"

  build-and-push-frontend:
    name: Build and push frontend image
    runs-on: ubuntu-latest
    needs: validate-release-ref
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract frontend Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deployment/docker/frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_BASE_URL=/api/v1
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN_PROD }}
            VITE_SENTRY_ENVIRONMENT=prod
            VITE_COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-landing:
    name: Build and push landing image
    runs-on: ubuntu-latest
    needs: validate-release-ref
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract landing Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.LANDING_IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}

      - name: Build and push landing image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deployment/docker/landing/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_GA_MEASUREMENT_ID=${{ secrets.VITE_GA_MEASUREMENT_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

