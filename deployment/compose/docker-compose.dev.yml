services:
  caddy:
    image: caddy:2.8-alpine
    container_name: barter-dev-caddy
    restart: unless-stopped
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:-barter-platform-dev.duckdns.org}
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      # Caddy is the only service exposed publicly on the DEV VM.
      # It terminates HTTPS, redirects HTTP to HTTPS, and proxies to
      # frontend/backend over the internal Docker network.
      - "80:80"
      - "443:443"
    volumes:
      # Caddyfile is versioned with deployment assets.
      - ../docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # /data stores Let's Encrypt certificates and ACME account material.
      # /config stores Caddy runtime configuration/state. Both must persist
      # across container recreates for reliable renewal and rate-limit safety.
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    networks:
      - barter-dev

  postgres:
    image: postgres:16-alpine
    container_name: barter-dev-postgres
    restart: unless-stopped
    env_file:
      - ../env/dev.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-barter_db}
      POSTGRES_USER: ${POSTGRES_USER:-barter_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - barter_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 256m
    networks:
      - barter-dev

  backend:
    image: ${BACKEND_IMAGE:-dragisahub1984/barter-backend:latest}
    container_name: barter-dev-backend
    restart: unless-stopped
    env_file:
      - ../env/dev.env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      JAVA_OPTS: ${JAVA_OPTS:--Xms128m -Xmx384m -XX:+UseContainerSupport -XX:MaxMetaspaceSize=160m}
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/barter_db}
      DB_USERNAME: ${DB_USERNAME:-barter_user}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      AZURE_STORAGE_CONNECTION_STRING_DEV: ${AZURE_STORAGE_CONNECTION_STRING_DEV:?AZURE_STORAGE_CONNECTION_STRING_DEV is required}
      AZURE_STORAGE_CONTAINER_DEV: ${AZURE_STORAGE_CONTAINER_DEV:?AZURE_STORAGE_CONTAINER_DEV is required}
      SPRING_MAIL_HOST: ${SMTP_HOST:-}
      SPRING_MAIL_PORT: ${SMTP_PORT:-587}
      SPRING_MAIL_USERNAME: ${SMTP_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@barter-platform.dev}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-}
      BARTER_SECURITY_ALLOWED_ORIGINS: ${BARTER_SECURITY_ALLOWED_ORIGINS:-}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://localhost:8080/actuator/health/readiness >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 75s
    mem_limit: 512m
    networks:
      - barter-dev

  frontend:
    image: ${FRONTEND_IMAGE:-dragisahub1984/barter-frontend:latest}
    container_name: barter-dev-frontend
    restart: unless-stopped
    env_file:
      - ../env/dev.env
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 128m
    networks:
      - barter-dev

volumes:
  caddy_data:
  caddy_config:
  barter_postgres_data:

networks:
  barter-dev:
    driver: bridge

