services:
  postgres:
    image: postgres:16-alpine
    container_name: barter-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-barter_db}
      POSTGRES_USER: ${POSTGRES_USER:-barter_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-barter_password}
    volumes:
      - barter-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-barter_user} -d ${POSTGRES_DB:-barter_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mailpit:
    image: axllent/mailpit:latest
    container_name: barter-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP – configured in application-local.yml
      - "8025:8025"   # Web UI – open http://localhost:8025 to inspect emails
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  barter-postgres-data:

